version: 2
builds:
  - main: .
    binary: xylem
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

brews:
  - repository:
      owner: lantzbuilds
      name: homebrew-tap
    homepage: https://github.com/lantzbuilds/xylem
    description: Terminal file browser with syntax highlighting
    license: MIT

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
